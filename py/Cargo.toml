[package]
name = "loopmini-py"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
loopmini = { path = ".." }
polling.workspace = true
pyo3 = { version = ">=0.29", features = ["extension-module", "py-clone", "abi3-py311"] }

[build-dependencies]
pyo3-build-config = ">=0.29"
