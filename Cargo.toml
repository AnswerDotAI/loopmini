[package]
name = "loopmini"
version = "0.2.3"
edition = "2021"
license = "Apache-2.0"
description = "Rust-backed asyncio event loop"
repository = "https://github.com/AnswerDotAI/loopmini"

[lib]
name = "loopmini"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = ">=0.28", features = ["py-clone"], optional = true }
polling = "3"

[features]
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.loopmini]
incremental = true

[profile.dist]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
strip = true

[profile.dist.package.loopmini]
incremental = false
